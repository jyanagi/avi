---
- name: Deploy Avi Controller(s), form a cluster, and configure vCenter Cloud
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
    - vault.yml
  vars:
    controllers: "{{ all_controllers[:cluster_size] }}"
    avi_controller_target: "{{ cluster_vip if cluster_size == 3 else controllers[0].ip }}"

  tasks:
    # -- Deploy VM(s) from content library --------------------
    - name: Deploy Controller VM(s) from content library
      vmware.vmware.deploy_content_library_ovf:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        library_item_name: "{{ library_item_name }}"
        library_name: "{{ library_name }}"
        vm_name: "{{ item.vm_name }}"
        datacenter: "{{ datacenter_name }}"
        datastore: "{{ datastore_name }}"
        resource_pool: "{{ resource_pool_name }}"
      loop: "{{ controllers }}"
      tags: [deploy]

    # -- Network and vApp properties ---------------------------
    - name: Set network and vApp properties for each node
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        name: "{{ item.vm_name }}"
        datacenter: "{{ datacenter_name }}"
        state: present
        networks:
          - name: "{{ management_network }}"
        vapp_properties:
          - id: "avi.mgmt-ip.CONTROLLER"
            value: "{{ item.ip }}"
          - id: "avi.mgmt-mask.CONTROLLER"
            value: "{{ controller_mask }}"
          - id: "avi.default-gw.CONTROLLER"
            value: "{{ controller_gw }}"
      loop: "{{ controllers }}"
      tags: [network]

    # -- Power on -------------------------------------------------
    - name: Power on each Controller node
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        name: "{{ item.vm_name }}"
        datacenter: "{{ datacenter_name }}"
        state: poweredon
      loop: "{{ controllers }}"
      tags: [poweron]

    # -- Wait for boot and confirm API -----------------------------
    - name: Wait for each Controller's management port to come up
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 443
        delay: 30
        timeout: 1800
      loop: "{{ controllers }}"
      tags: [bootstrap]

    - name: Confirm Controller API is responding
      ansible.builtin.uri:
        url: "https://{{ item.ip }}/api/initial-data"
        method: GET
        validate_certs: false
        status_code: [200, 401, 403]
      loop: "{{ controllers }}"
      tags: [bootstrap]

    # -- Session login and password change ------------------------
    - name: Log in to Avi Controller to establish session
      ansible.builtin.uri:
        url: "https://{{ item.ip }}/login"
        method: POST
        validate_certs: false
        body_format: json
        body:
          username: "admin"
          password: "{{ vault_avi_initial_password }}"
        status_code: [200]
      register: avi_login
      loop: "{{ controllers }}"
      tags: [bootstrap]

    - name: Set new admin password using session auth
      ansible.builtin.uri:
        url: "https://{{ item.item.ip }}/api/useraccount"
        method: PUT
        validate_certs: false
        headers:
          X-CSRFToken: "{{ item.cookies.csrftoken }}"
          Referer: "https://{{ item.item.ip }}/"
          Cookie: "csrftoken={{ item.cookies.csrftoken }}; sessionid={{ item.cookies.sessionid }}"
        body_format: json
        body:
          old_password: "{{ vault_avi_initial_password }}"
          password: "{{ vault_avi_admin_password }}"
        status_code: [200, 201]
      loop: "{{ avi_login.results }}"
      tags: [bootstrap]

    # -- Cluster formation ------------------------------------------
    - name: Build node list for cluster
      ansible.builtin.set_fact:
        avi_cluster_nodes: "{{ avi_cluster_nodes | default([]) + [ {'ip': {'addr': item.ip, 'type': 'V4'}, 'name': item.vm_name, 'password': vault_avi_admin_password} ] }}"
      loop: "{{ controllers }}"
      when: cluster_size == 3
      tags: [cluster]

    - name: Form Controller cluster
      vmware.alb.avi_cluster:
        avi_credentials:
          controller: "{{ controllers[0].ip }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "{{ cluster_name }}"
        virtual_ip:
          addr: "{{ cluster_vip }}"
          type: V4
        nodes: "{{ avi_cluster_nodes }}"
      when: cluster_size == 3
      tags: [cluster]

    # -- Wait for cluster to finish forming --------------------------
    - name: Log in to leader for cluster status check
      ansible.builtin.uri:
        url: "https://{{ controllers[0].ip }}/login"
        method: POST
        validate_certs: false
        body_format: json
        body:
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
        status_code: [200]
      register: cluster_check_login
      when: cluster_size == 3
      tags: [cluster]

    - name: Wait for cluster to become ready
      ansible.builtin.uri:
        url: "https://{{ controllers[0].ip }}/api/cluster"
        method: GET
        validate_certs: false
        headers:
          Cookie: "csrftoken={{ cluster_check_login.cookies.csrftoken }}; sessionid={{ cluster_check_login.cookies.sessionid }}"
        status_code: [200, 503]
      register: cluster_status
      until: cluster_status.status == 200 and cluster_status.json.nodes is defined and (cluster_status.json.nodes | length) == cluster_size
      retries: 120
      delay: 60
      when: cluster_size == 3
      tags: [cluster]

    - name: Pause briefly after cluster ready to allow leader election to settle
      ansible.builtin.pause:
        echo: no
        seconds: 60
      when: cluster_size == 3
      tags: [cluster]

    # -- Post-cluster system configuration (always target the cluster VIP) --
    - name: Configure DNS, NTP, and SMTP
      vmware.alb.avi_systemconfiguration:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        dns_configuration:
          search_domain: "{{ avi_dns_search_domain }}"
          server_list: "{{ avi_dns_servers }}"
        ntp_configuration:
          ntp_servers: "{{ avi_ntp_servers }}"
        email_configuration:
          smtp_type: "SMTP_NONE"
      tags: [systemconfig]

    - name: Set backup passphrase
      vmware.alb.avi_backupconfiguration:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "Backup-Configuration"
        backup_passphrase: "{{ vault_avi_backup_passphrase }}"
        upload_to_remote_host: false
      tags: [systemconfig]


    # -- vCenter Cloud configuration -----------------------------------
    - name: Create vCenter Cloud (initial, without management_network)
      vmware.alb.avi_cloud:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "{{ vcenter_cloud_name }}"
        vtype: "CLOUD_VCENTER"
        dhcp_enabled: "{{ avi_cloud_dhcp_enabled }}"
        prefer_static_routes: true
        ip6_autocfg_enabled: false
        mgmt_ip_v6_enabled: false
        vcenter_configuration:
          username: "{{ vcenter_username }}"
          password: "{{ vcenter_password }}"
          vcenter_url: "{{ vcenter_hostname }}"
          datacenter: "{{ datacenter_name }}"
          privilege: "WRITE_ACCESS"
          use_content_lib: false
      tags: [cloud]

    - name: Pause for vCenter inventory discovery
      ansible.builtin.pause:
        seconds: "{{ avi_cloud_discovery_wait }}"
      tags: [cloud]

    - name: Log in for network lookup
      ansible.builtin.uri:
        url: "https://{{ avi_controller_target }}/login"
        method: POST
        validate_certs: false
        body_format: json
        body:
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
        status_code: [200]
      register: net_lookup_login
      tags: [cloud]

    - name: Look up discovered management network for SEs
      ansible.builtin.uri:
        url: "https://{{ avi_controller_target }}/api/vimgrnwruntime/?name={{ avi_se_management_network }}"
        method: GET
        validate_certs: false
        headers:
          Cookie: "csrftoken={{ net_lookup_login.cookies.csrftoken }}; sessionid={{ net_lookup_login.cookies.sessionid }}"
      register: se_network_lookup
      tags: [cloud]

    - name: Update vCenter Cloud with resolved management network
      vmware.alb.avi_cloud:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        avi_api_update_method: patch
        avi_api_patch_op: replace
        name: "{{ vcenter_cloud_name }}"
        vtype: "CLOUD_VCENTER"
        dhcp_enabled: "{{ avi_cloud_dhcp_enabled }}"
        ip6_autocfg_enabled: false
        mgmt_ip_v6_enabled: false
        prefer_static_routes: true
        vcenter_configuration:
          username: "{{ vcenter_username }}"
          password: "{{ vcenter_password }}"
          vcenter_url: "{{ vcenter_hostname }}"
          datacenter: "{{ datacenter_name }}"
          privilege: "WRITE_ACCESS"
          use_content_lib: false
          management_network: "{{ se_network_lookup.json.results[0].url }}"
      tags: [cloud]

    - name: Create Service Engine Group for vCenter Cloud
      vmware.alb.avi_serviceenginegroup:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "{{ avi_se_group_name }}"
        cloud_ref: "/api/cloud/?name={{ vcenter_cloud_name }}"
        vcenter_folder: "{{ avi_se_vcenter_folder }}"
        vcenter_clusters:
          cluster_refs:
            - "/api/vimgrclusterruntime/?name={{ vcenter_cluster_name }}"
          include: true
        vcpus_per_se: "{{ avi_se_vcpu }}"
        memory_per_se: "{{ avi_se_mem }}"
        min_se: "{{ avi_se_min_count }}"
        max_se: "{{ avi_se_max_count }}"
        min_scaleout_per_vs: "{{ avi_se_min_scaleout_per_vs }}"
        max_vs_per_se: "{{ avi_se_max_vs }}"
        buffer_se: 0
        se_name_prefix: "{{ avi_se_name_prefix }}"
        ha_mode: "{{ avi_se_ha_mode }}"
        realtime_se_metrics: 
          enabled: "{{ avi_realtime_se_metrics }}"
          duration: "{{ avi_realtime_se_metrics_duration }}"
      tags: [cloud]

    # -- vCenter Cloud Network configuration ---------------------------
    - name: Configure Cloud network for SE Data Network
      vmware.alb.avi_network:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "{{ avi_se_data_network }}"
        cloud_ref: "/api/cloud/?name={{ vcenter_cloud_name }}"
        configured_subnets:
          - prefix:
              ip_addr:
                type: "V4"
                addr: "{{ net_address }}"
              mask: "{{ net_maskbit }}"
            static_ip_ranges:
              - range:
                  begin:
                    type: "V4"
                    addr: "{{ beg_vnic_addr }}"
                  end:
                    type: "V4"
                    addr: "{{ end_vnic_addr }}"
                type: "STATIC_IPS_FOR_SE"
              - range:
                  begin:
                    type: "V4"
                    addr: "{{ beg_vip_addr }}"
                  end:
                    type: "V4"
                    addr: "{{ end_vip_addr }}"
                type: "STATIC_IPS_FOR_VIP"
        exclude_discovered_subnets: false
        synced_from_se: false
        dhcp_enabled: "{{ net_dhcp }}"
      register: avi_se_data_network_result
      tags: [network]

    - name: Configure IPAM Profile
      vmware.alb.avi_ipamdnsproviderprofile:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "{{ avi_ipam_profile_name }}"
        type: "IPAMDNS_TYPE_INTERNAL"
        allocate_ip_in_vrf: false
        internal_profile:
          ttl: 30
          usable_networks:
            - nw_ref: "{{ avi_se_data_network_result.obj.url }}"
      register: ipam_profile_result
      tags: [network]

    # -- Update vCenter Cloud configuration with IPAM Profile-----------
    - name: Update vCenter Cloud with IPAM Profile
      vmware.alb.avi_cloud:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        avi_api_update_method: patch
        avi_api_patch_op: replace
        name: "{{ vcenter_cloud_name }}"
        ipam_provider_ref: "{{ ipam_profile_result.obj.url }}"
      tags: [network]

    # -- Configure VRF Context with Default Route ---------------------
    - name: Configure VRF Context with Default Route
      vmware.alb.avi_vrfcontext:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        cloud_ref: "/api/cloud/?name={{ vcenter_cloud_name }}"
        name: "{{ avi_vrf_context }}"
        static_routes:
          - cloud_ref: "/api/cloud/?name={{ vcenter_cloud_name }}"
            next_hop:
              addr: "{{ net_gateway }}"
              type: "V4"
            prefix_text: "0.0.0.0/0"
            prefix:
              ip_addr:
                addr: "0.0.0.0"
                type: "V4"
              mask: '0'
            route_id: '1'
      tags: [network]          
