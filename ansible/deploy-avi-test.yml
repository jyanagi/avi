---
- name: Deploy Avi Controller(s), form a cluster, and configure vCenter Cloud
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vars.yml
    - vault.yml
  vars:
    controllers: "{{ all_controllers[:cluster_size] }}"
    avi_controller_target: "{{ cluster_vip if cluster_size == 3 else controllers[0].ip }}"

  tasks:
    # -- Deploy VM(s) from content library --------------------
    - name: Deploy Controller VM(s) from content library
      vmware.vmware.deploy_content_library_ovf:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        library_item_name: "{{ library_item_name }}"
        library_name: "{{ library_name }}"
        vm_name: "{{ item.vm_name }}"
        datacenter: "{{ datacenter_name }}"
        datastore: "{{ datastore_name }}"
        resource_pool: "{{ resource_pool_name }}"
      loop: "{{ controllers }}"
      tags: [deploy]

    # -- Network and vApp properties ---------------------------
    - name: Set network and vApp properties for each node
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        name: "{{ item.vm_name }}"
        datacenter: "{{ datacenter_name }}"
        state: present
        networks:
          - name: "{{ management_network }}"
        vapp_properties:
          - id: "avi.mgmt-ip.CONTROLLER"
            value: "{{ item.ip }}"
          - id: "avi.mgmt-mask.CONTROLLER"
            value: "{{ controller_mask }}"
          - id: "avi.default-gw.CONTROLLER"
            value: "{{ controller_gw }}"
      loop: "{{ controllers }}"
      tags: [network]

    # -- Power on -------------------------------------------------
    - name: Power on each Controller node
      community.vmware.vmware_guest:
        hostname: "{{ vcenter_hostname }}"
        username: "{{ vcenter_username }}"
        password: "{{ vcenter_password }}"
        validate_certs: false
        name: "{{ item.vm_name }}"
        datacenter: "{{ datacenter_name }}"
        state: poweredon
      loop: "{{ controllers }}"
      tags: [poweron]

    # -- Wait for boot and confirm API -----------------------------
    - name: Wait for each Controller's management port to come up
      ansible.builtin.wait_for:
        host: "{{ item.ip }}"
        port: 443
        delay: 30
        timeout: 1800
      loop: "{{ controllers }}"
      tags: [bootstrap]

    - name: Confirm Controller API is responding
      ansible.builtin.uri:
        url: "https://{{ item.ip }}/api/initial-data"
        method: GET
        validate_certs: false
        status_code: [200, 401, 403]
      loop: "{{ controllers }}"
      tags: [bootstrap]

    # -- Session login and password change ------------------------
    - name: Log in to Avi Controller to establish session
      ansible.builtin.uri:
        url: "https://{{ item.ip }}/login"
        method: POST
        validate_certs: false
        body_format: json
        body:
          username: "admin"
          password: "{{ vault_avi_initial_password }}"
        status_code: [200]
      register: avi_login
      loop: "{{ controllers }}"
      tags: [bootstrap]

    - name: Set new admin password using session auth
      ansible.builtin.uri:
        url: "https://{{ item.item.ip }}/api/useraccount"
        method: PUT
        validate_certs: false
        headers:
          X-CSRFToken: "{{ item.cookies.csrftoken }}"
          Referer: "https://{{ item.item.ip }}/"
          Cookie: "csrftoken={{ item.cookies.csrftoken }}; sessionid={{ item.cookies.sessionid }}"
        body_format: json
        body:
          old_password: "{{ vault_avi_initial_password }}"
          password: "{{ vault_avi_admin_password }}"
        status_code: [200, 201]
      loop: "{{ avi_login.results }}"
      tags: [bootstrap]

    # -- Cluster formation ------------------------------------------
    - name: Build node list for cluster
      ansible.builtin.set_fact:
        avi_cluster_nodes: "{{ avi_cluster_nodes | default([]) + [ {'ip': {'addr': item.ip, 'type': 'V4'}, 'name': item.vm_name, 'password': vault_avi_admin_password} ] }}"
      loop: "{{ controllers }}"
      when: cluster_size == 3
      tags: [cluster]

    - name: Form Controller cluster
      vmware.alb.avi_cluster:
        avi_credentials:
          controller: "{{ controllers[0].ip }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "{{ cluster_name }}"
        virtual_ip:
          addr: "{{ cluster_vip }}"
          type: V4
        nodes: "{{ avi_cluster_nodes }}"
      when: cluster_size == 3
      tags: [cluster]

    # -- Wait for cluster to finish forming --------------------------
    - name: Log in to leader for cluster status check
      ansible.builtin.uri:
        url: "https://{{ controllers[0].ip }}/login"
        method: POST
        validate_certs: false
        body_format: json
        body:
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
        status_code: [200]
      register: cluster_check_login
      when: cluster_size == 3
      tags: [cluster]

    - name: Wait for cluster to become ready
      ansible.builtin.uri:
        url: "https://{{ controllers[0].ip }}/api/cluster"
        method: GET
        validate_certs: false
        headers:
          Cookie: "csrftoken={{ cluster_check_login.cookies.csrftoken }}; sessionid={{ cluster_check_login.cookies.sessionid }}"
        status_code: [200, 503]
      register: cluster_status
      until: cluster_status.status == 200 and cluster_status.json.nodes is defined and (cluster_status.json.nodes | length) == cluster_size
      retries: 120
      delay: 60
      when: cluster_size == 3
      tags: [cluster]

    - name: Pause briefly after cluster ready to allow leader election to settle
      ansible.builtin.pause:
        echo: no
        seconds: 60
      when: cluster_size == 3
      tags: [cluster]

    # -- Post-cluster system configuration (always target the cluster VIP) --
    - name: Configure DNS, NTP, and SMTP
      vmware.alb.avi_systemconfiguration:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        dns_configuration:
          search_domain: "{{ avi_dns_search_domain }}"
          server_list: "{{ avi_dns_servers }}"
        ntp_configuration:
          ntp_servers: "{{ avi_ntp_servers }}"
        email_configuration:
          smtp_type: "SMTP_NONE"
      tags: [systemconfig]

    - name: Set backup passphrase
      vmware.alb.avi_backupconfiguration:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "Backup-Configuration"
        backup_passphrase: "{{ vault_avi_backup_passphrase }}"
        upload_to_remote_host: false
      tags: [systemconfig]

    # -- vCenter Cloud configuration -----------------------------------
    - name: Create vCenter Cloud
      vmware.alb.avi_cloud:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "{{ vcenter_cloud_name }}"
        vtype: "CLOUD_VCENTER"
        dhcp_enabled: "{{ avi_cloud_dhcp_enabled }}"
        prefer_static_routes: true
        ip6_autocfg_enabled: false
        mgmt_ip_v6_enabled: false
        vcenter_configuration:
          username: "{{ vcenter_username }}"
          password: "{{ vcenter_password }}"
          vcenter_url: "{{ vcenter_hostname }}"
          datacenter: "{{ datacenter_name }}"
          content_lib:
            use_content_lib: true
            name: "{{ library_name }}"
          management_network: "{{ avi_se_management_network }}"
          privilege: "WRITE_ACCESS"
      tags: [cloud]

    - name: Pause for vCenter inventory discovery
      ansible.builtin.pause:
        seconds: "{{ avi_cloud_discovery_wait }}"
      tags: [cloud]

    - name: Create Service Engine Group for vCenter Cloud
      vmware.alb.avi_serviceenginegroup:
        avi_credentials:
          controller: "{{ avi_controller_target }}"
          username: "admin"
          password: "{{ vault_avi_admin_password }}"
          api_version: "{{ avi_api_version }}"
        name: "{{ avi_se_group_name }}"
        cloud_ref: "/api/cloud/?name={{ vcenter_cloud_name }}"
        vcenter_folder: "{{ avi_se_vcenter_folder }}"
        vcenter_clusters:
          cluster_refs:
            - "/api/vimgrclusterruntime/?name={{ vcenter_cluster_name }}"
          include: true
        max_se: "{{ avi_se_max_count }}"
        buffer_se: 0
        se_name_prefix: "{{ avi_se_name_prefix }}"
        ha_mode: "{{ avi_se_ha_mode }}"
        max_vs_per_se: "{{ avi_se_max_vs }}"
      tags: [cloud]


